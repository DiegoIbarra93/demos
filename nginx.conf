server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # ---------------------------------------------------------------------------
    # Security headers — applied to EVERY response from this server (incl. 404).
    # `always` is required so nginx also adds them to non-2xx/3xx replies.
    # ---------------------------------------------------------------------------
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), geolocation=(), microphone=(), payment=(), usb=()" always;

    # Content-Security-Policy for the static demo sites.
    #
    # Sources allowed beyond the baseline, each verified against the current pages:
    #   script-src 'unsafe-inline'                 -> inline <script> in
    #       long-walk-vineyard/index.html (nav toggle / sticky header), the GA4 gtag
    #       bootstrap snippet, and onclick="return false" demo phone links.
    #   script-src  https://www.googletagmanager.com -> GA4 gtag.js
    #   connect-src https://*.google-analytics.com + https://www.google-analytics.com
    #       -> GA4 measurement beacons
    #   style-src 'unsafe-inline'                  -> both pages use inline <style>
    #       blocks and style="" attributes
    #   style-src   https://fonts.googleapis.com   -> Google Fonts stylesheet <link>
    #   font-src    https://fonts.gstatic.com      -> webfont files requested by it
    #   img-src     data:                          -> inline data: images/placeholders
    #   frame-ancestors 'self'                     -> same-site framing only (matches
    #       X-Frame-Options SAMEORIGIN; keeps same-site embeds working)
    # Tightening directives (cannot break these static pages):
    #   object-src 'none', base-uri 'self'
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'unsafe-inline' https://www.googletagmanager.com; connect-src 'self' https://*.google-analytics.com https://www.google-analytics.com https://www.googletagmanager.com; img-src 'self' data: https://www.google-analytics.com; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com; object-src 'none'; base-uri 'self'; frame-ancestors 'self'" always;

    # Root: autoindex directory listing of the customer demo sites
    location = / {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        try_files $uri $uri/ =404;
    }

    # Explicit 404
    error_page 404 /404.html;
}
