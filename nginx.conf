server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Root: autoindex directory listing of the customer demo sites
    location = / {
        autoindex on;
        autoindex_exact_size off;
        autoindex_localtime on;
        try_files $uri $uri/ =404;
    }

    # Explicit 404
    error_page 404 /404.html;
}
